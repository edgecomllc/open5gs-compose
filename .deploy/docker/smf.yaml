logger:
#  file:
#    path: @localstatedir@/log/open5gs/smf.log
  level: info   # fatal|error|warn|info(default)|debug|trace

global:
  max:
    ue: 250  # The number of UE can be increased depending on memory size.
#    peer: 64

smf:
#  sbi:
#    server:
#      - dev: eth0
#        port: 7777
#    client:
#     nrf:
#       - uri: http://open5gs-nrf-sbi:7777
#    #  scp:
#    #    - uri: http://open5gs-nrf-sbi:7777
  pfcp:
    server:
      - address: smf
    client:
      upf:
        - address: upf
  gtpc:
    server:
      - address: smf
  gtpu:
    server:
      - address: smf
  metrics:
    server:
      - address: 0.0.0.0
        port: 9090
  session:
    - subnet: 10.110.26.0/26
      gateway: 10.110.26.1
      dnn: brt.tg
    - subnet: 10.110.26.64/26
      gateway: 10.110.26.65
      dnn: brt.insp
    - subnet: 10.110.26.128/26
      gateway: 10.110.26.129
      dnn: brt.serv
    
  dns:
    - 10.110.20.120
    - 10.110.20.121
  mtu: 1400
  freeDiameter: /opt/open5gs/etc/diameter/smf/smf.conf
