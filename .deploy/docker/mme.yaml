logger:
  level: info
global:
  max:
    ue: 250
  parameter:
    fake_csfb: true
      
mme:
  freeDiameter: /opt/open5gs/etc/diameter/mme/mme.conf
  s1ap:
    server:
      - address: 0.0.0.0
        port: 36412
  gtpc:
    server:
      - address: 0.0.0.0
        port: 2123
    client:
      sgwc:
        - address: sgwc
      smf:
        - address: smf
  metrics:
    server:
      - address: 0.0.0.0
        port: 9090
  gummei:
    - plmn_id:
        mcc: 999
        mnc: 99 #23
      mme_gid: 2
      mme_code: 1
  tai:
    - plmn_id:
        mcc: 999
        mnc: 99 #23
      tac: 15054
  security:
    integrity_order:
      - EIA2
      - EIA1
      - EIA0
    ciphering_order:
      - EEA0
      - EEA1
      - EEA2
  network_name:
    full: BRT PLTE
    short: BRT
  mme_name: brt-epc1-mme1
#  time:
#    t3402:
#      value: 720   # 12 minutes * 60 = 720 seconds
#    t3396:
#      value: 720   # 12 minutes * 60 = 720 seconds
#    t3412:
#      value: 60  # 54 minutes * 60 = 3240 seconds
#    t3423:
#      value: 720   # 12 minutes * 60 = 720 seconds    
  access_control:
    default_reject_cause: 11
    plmn_id:
      mcc: 999
      mnc: 99 #23
