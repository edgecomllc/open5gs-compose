storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

net:
  port: 27017
  bindIp: 0.0.0.0

processManagement:
  fork: false

security:
  enableEncryption: true
  vault:
    serverName: openbao
    port: 8200
    tokenFile: /etc/mongodb-encryption/vault-token
    secret: secret/psmdb-encryption
