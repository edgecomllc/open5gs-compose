storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1

net:
  port: 27017
  bindIp: 0.0.0.0

processManagement:
  fork: false

# Data-at-Rest encryption (Percona Server for MongoDB) with the master key
# stored in OpenBao (Vault-compatible KMS) over TLS.
# NOTE: enableEncryption only takes effect on a freshly created (empty) dbPath.
security:
  enableEncryption: true
  vault:
    serverName: openbao
    port: 8200
    tokenFile: /etc/mongodb-encryption/vault-token
    secret: secret/data/psmdb-encryption
    serverCAFile: /etc/mongodb-tls/ca.crt


