logger:
  level: info
parameter: {}
global: {}
nssf:
  sbi:
    server:
      - dev: eth0
        port: 7777
    client:
      nrf:
        - uri: http://open5gs-nrf-sbi:7777
      nsi:
        - uri: http://open5gs-nrf-sbi:7777
          s_nssai:
            sst: 1
        - uri: http://open5gs-nrf-sbi:7777
          s_nssai:
            sst: 1
            sd: "0x111111"
        - uri: http://open5gs-nrf-sbi:7777
          s_nssai:
            sst: 1
            sd: "0x222222"
        - uri: http://open5gs-nrf-sbi:7777
          s_nssai:
            sst: 1
            sd: "0x333333"
        - uri: http://open5gs-nrf-sbi:7777
          s_nssai:
            sst: 1
            sd: "0xFFFFFF"
