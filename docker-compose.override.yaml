
services:
  sgwu:
    command:
      - sleep infinity
    ports: !reset []

  upf:
    #image: ghcr.io/edgecomllc/eupf-dev:623857f74497041465ddd80e1d5038fc1f3d1c17
    #image: ghcr.io/edgecomllc/eupf-dev:7c67d925c78a7d4f61fcd4eba6c0046b2de28a93
    #image: ghcr.io/edgecomllc/eupf-dev:31e000bd1d7857bb3437196e6a4a2dd155a4c349
    image: ghcr.io/edgecomllc/eupf-dev:feat-combined-dataplane
    profiles: [4g-core, 5g-core]
    privileged: true
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - ./dumps/sgwu:/dumps
    environment:
      GIN_MODE: release
      UPF_INTERFACE_NAME: eth0
      UPF_XDP_ATTACH_MODE: native
      UPF_API_ADDRESS: ":8081"
      UPF_METRICS_ADDRESS: ":9091"
      UPF_PFCP_ADDRESS: "upf:8805"
      UPF_PFCP_NODE_ID: "upf"
        #UPF_N3_ADV_ADDRESS: 10.0.0.60
      UPF_N3_ADV_ADDRESS: 11.131.226.142
      UPF_N3_ADV_ADDRESS_5G: 11.131.226.142
      UPF_N3_ADDRESS: ${UPF_IP}
        #UPF_N3_ADDRESS: 10.0.0.60
        #UPF_N9_ADDRESS: 11.131.226.142
        #UPF_N9_ADDRESS: 10.0.0.60
      UPF_N9_ADV_ADDRESS: ${UPF_IP}
      UPF_N9_ADDRESS: ${UPF_IP}
      UPF_GTP_PEER: 10.0.0.210:2152
      UPF_HUAWEI_SUPPORT: false
      UPF_LOGGING_LEVEL: debug
      UPF_FEATURE_FTUP: true
    entrypoint: ""
    command:
      - /bin/sh
      - -c
      - |
        apk add tcpdump
        ping -c 5 nat
        mkdir -p /etc/iproute2
        echo "1200 n6if" >> /etc/iproute2/rt_tables
        ip rule add from 10.167.71.192/26 table n6if
        ip route add default via `nslookup nat | awk '/^Address: / { print $2 }'` dev eth0 table n6if
        /app/bin/eupf
    ulimits:
      memlock: -1
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      core-network:
        ipv4_address: ${UPF_IP}
    ports:
      #- 10.0.0.60:2152:2152/udp
      - 11.131.226.142:2152:2152/udp
    sysctls:
      - net.ipv4.conf.all.forwarding=1

  eupf-cli:
    profiles: [edgecom]
    build:
      context: ../../../
      dockerfile: Dockerfile.cli
    volumes:
      - ./backups:/var/lib/eupf/backups
    networks:
      core-network:

