  blackbox_exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox_exporter
    volumes:
      - .deploy/docker/monitoring/blackbox-exporter/blackbox.yml:/etc/blackbox_exporter/config.yml
    restart: always
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    network_mode: "service:nat"

  nat:
    image: wbitt/network-multitool:alpine-minimal
    profiles: [4g-core, 5g-core]
    sysctls:
      - net.ipv4.conf.all.forwarding=1
    cap_add:
      - NET_ADMIN
    networks:
      core-network:
    depends_on:
      - upf
    entrypoint: ""
    ports:
      - "9115:9115"
    command:
      - /bin/sh
      - -c
      - |
        ping -c 5 upf
        iptables -t nat -A POSTROUTING -s 10.167.71.192/26 -o eth0 -j MASQUERADE
        iptables -A FORWARD -j ACCEPT
        ip route add 10.167.71.192/26 via `nslookup upf | awk '/^Address: / { print $2 }'` dev eth0
        tail -f /dev/null


