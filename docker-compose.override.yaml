
services:
  sgwu:
    command:
      - sleep infinity
    ports: !reset []

  upf:
    # In order to download eupf image from eupf-dev registry use docker login with appropriate credentials first
    image: ghcr.io/edgecomllc/eupf-dev:feat-combined-dataplane
    #image: ghcr.io/edgecomllc/eupf-dev:feat-combined-dataplane-no-gtp-ext
    profiles: [4g-core, 5g-core]
    privileged: true
    volumes:
      - /sys/fs/bpf:/sys/fs/bpf
      - ./dumps/sgwu:/dumps
    environment:
      GIN_MODE: release
      UPF_INTERFACE_NAME: eth0
      UPF_XDP_ATTACH_MODE: native
      UPF_API_ADDRESS: ":8081"
      UPF_METRICS_ADDRESS: ":9091"
      UPF_PFCP_ADDRESS: "upf:8805"
      UPF_PFCP_NODE_ID: "upf"
        #UPF_N3_ADV_ADDRESS: 10.0.0.60
      UPF_N3_ADV_ADDRESS: 11.131.226.162
      UPF_N3_ADV_ADDRESS_5G: 11.131.226.142
      UPF_N3_ADDRESS: ${UPF_IP}
        #UPF_N3_ADDRESS: 10.0.0.60
        #UPF_N9_ADDRESS: 11.131.226.142
        #UPF_N9_ADDRESS: 10.0.0.60
      UPF_N9_ADV_ADDRESS: ${UPF_IP}
      UPF_N9_ADDRESS: ${UPF_IP}
      UPF_GTP_PEER: 11.131.226.141:2152,11.131.218.66:2152,10.0.0.150:2152
        #UPF_GTP_PEER: 11.131.226.141:2152,10.0.0.210:2152
      UPF_HUAWEI_SUPPORT: false
      UPF_LOGGING_LEVEL: debug
      UPF_FEATURE_FTUP: true
    entrypoint: ""
    command:
      - /bin/sh
      - -c
      - |
        apk add tcpdump
        ping -c 5 nat
        mkdir -p /etc/iproute2
        echo "1200 n6if" >> /etc/iproute2/rt_tables
        ip rule add from 10.167.71.0/24 table n6if
        ip route add default via `nslookup nat | awk '/^Address: / { print $2 }'` dev eth0 table n6if
        /app/bin/eupf
    ulimits:
      memlock: -1
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    networks:
      core-network:
        ipv4_address: ${UPF_IP}
    ports:
      - 2152:2152/udp
    sysctls:
      - net.ipv4.conf.all.forwarding=1

  eupf-cli:
    profiles: [edgecom]
    build:
      context: ../../../
      dockerfile: Dockerfile.cli
    volumes:
      - ./backups:/var/lib/eupf/backups
    networks:
      core-network:

  blackbox_exporter:
    image: prom/blackbox-exporter:v0.28.0
    container_name: blackbox_exporter
    volumes:
      - .deploy/docker/monitoring/blackbox-exporter/blackbox.yml:/etc/blackbox_exporter/config.yml
    restart: always
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    network_mode: "service:nat"

  nat:
    image: wbitt/network-multitool:alpine-minimal
    profiles: [4g-core, 5g-core]
    sysctls:
      - net.ipv4.conf.all.forwarding=1
    cap_add:
      - NET_ADMIN
    networks:
      core-network:
    depends_on:
      - upf
    entrypoint: ""
    ports:
      - "9115:9115"
    command:
      - /bin/sh
      - -c
      - |
        ping -c 5 upf
        iptables -t nat -A POSTROUTING -s 10.167.71.0/24 -o eth0 -j MASQUERADE
        iptables -A FORWARD -j ACCEPT
        ip route add 10.167.71.0/24 via `nslookup upf | awk '/^Address: / { print $2 }'` dev eth0
        tail -f /dev/null


